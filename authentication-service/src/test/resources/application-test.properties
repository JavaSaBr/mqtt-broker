authentication.provider.basic.enabled=true
authentication.provider.basic.credentials-sources.file.fs-path=classpath:credentials/test
authentication.provider.basic.credentials-sources.database.db-driver=postgresql
authentication.provider.basic.credentials-sources.database.db-host=localhost
authentication.provider.basic.credentials-sources.database.db-port=5432
authentication.provider.basic.credentials-sources.database.db-name=testdb
authentication.provider.basic.credentials-sources.database.max-idle-time=30m
authentication.provider.basic.credentials-sources.database.initial-pool-size=5
authentication.provider.basic.credentials-sources.database.max-pool-size=10
authentication.provider.basic.credentials-sources.database.lock-timeout=10s
authentication.provider.basic.credentials-sources.database.statement-timeout=5min
