buildscript {
  repositories {
    maven {
      url "https://plugins.gradle.org/m2/"
    }
  }
  dependencies {
    classpath "org.springframework.boot:spring-boot-gradle-plugin:4.0.2"
    classpath "org.graalvm.buildtools:native-gradle-plugin:1.1.1"
  }
}

repositories {
  maven {
    url  "https://gitlab.com/api/v4/projects/37512056/packages/maven"
  }
}

rootProject.version = "0.0.1"
group = "javasabr.mqtt"

subprojects {
  repositories {
    mavenCentral()
    mavenLocal()
    maven {
      url  "https://gitlab.com/api/v4/projects/37512056/packages/maven"
    }
  }

  configurations.configureEach {
    resolutionStrategy.force 'org.slf4j:slf4j-api:2.+'
    exclude group: "org.slf4j", module: "slf4j-log4j12"
    exclude group: "org.slf4j", module: "slf4j-reload4j"
    exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
  }
}

tasks.register("buildSingleArtifact", GradleBuild) {
  group = "build"
  description = "Build all modules -> Build result artifact"
  tasks = ['build', 'bootJar']
}

tasks.register("buildSingleArtifactWithoutTests", GradleBuild) {
  group = "build"
  description = "Build all modules without tests -> Build result artifact"
  tasks = ['classes', 'bootJar']
}

wrapper {
  gradleVersion = '9.1.0'
  distributionType = Wrapper.DistributionType.ALL
}
